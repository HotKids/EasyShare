name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Build release APK for pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Build and sign release APKs
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"

          signing_dir="$(mktemp -d "$RUNNER_TEMP/easy-share-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          keystore_path="$signing_dir/release.jks"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          export SIGNING_KEYSTORE_PATH="$keystore_path"

          ./gradlew assembleRelease --no-daemon

          signed_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$signed_apk"

          mkdir -p release
          cp "$signed_apk" release/easy-share-universal.apk
          cp "$signed_apk" "$signing_dir/arm64-unaligned.apk"
          zip -q -d "$signing_dir/arm64-unaligned.apk" \
            'lib/armeabi/*' 'lib/armeabi-v7a/*' 'lib/x86/*' 'lib/x86_64/*'

          "$build_tools/zipalign" -f 4 \
            "$signing_dir/arm64-unaligned.apk" "$signing_dir/arm64-aligned.apk"

          "$build_tools/apksigner" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out release/easy-share-arm64.apk \
            "$signing_dir/arm64-aligned.apk"

          rm -f "$keystore_path"
          unset SIGNING_KEYSTORE_PATH SIGNING_KEYSTORE_BASE64
          unset SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD SIGNING_KEY_ALIAS

          "$build_tools/apksigner" verify --verbose release/easy-share-universal.apk
          "$build_tools/apksigner" verify --verbose release/easy-share-arm64.apk
          (cd release && sha256sum easy-share-*.apk > SHA256SUMS)

      - name: Upload signed APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easy-share-${{ github.ref_name }}
          path: |
            release/easy-share-universal.apk
            release/easy-share-arm64.apk
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download signed APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easy-share-main
          path: release

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              app/build.gradle.kts
          )"
          test -n "$version_name"
          test "$(printf '%s\n' "$version_name" | wc -l)" -eq 1
          printf 'tag=v%s\n' "$version_name" >> "$GITHUB_OUTPUT"

      - name: Create version tag and GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping publication."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_tag="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv' 2>/dev/null || true
          )"

          if [[ -n "$existing_tag" ]]; then
            IFS=$'\t' read -r object_type object_sha <<< "$existing_tag"
            if [[ "$object_type" != "commit" || "$object_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already exists but does not point to this commit." >&2
              exit 1
            fi
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          gh release create "$RELEASE_TAG" \
            release/easy-share-universal.apk \
            release/easy-share-arm64.apk \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Easy Share $RELEASE_TAG"

          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Remove previous releases and release tags
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          releases="$(
            gh api \
              --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | [.id, .tag_name] | @tsv'
          )"

          while IFS=$'\t' read -r release_id release_tag; do
            if [[ -n "$release_id" && "$release_tag" != "$CURRENT_TAG" ]]; then
              echo "Removing previous release: $release_tag"
              gh api \
                --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/$release_id"
            fi
          done <<< "$releases"

          release_tags="$(
            gh api \
              --paginate \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v?per_page=100" \
              --jq '.[].ref'
          )"

          while IFS= read -r tag_ref; do
            tag_name="${tag_ref#refs/tags/}"
            if [[ -n "$tag_name" && "$tag_name" != "$CURRENT_TAG" ]]; then
              echo "Removing previous release tag: $tag_name"
              gh api \
                --method DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/${tag_ref#refs/}"
            fi
          done <<< "$release_tags"
